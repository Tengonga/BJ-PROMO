<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canje · BlackJack Promo</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --red:#d7192a; --green:#1f9d55; --ink:#0d0d0d; --paper:#f7f1e6; --gold:#e8c46a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Inter,system-ui,sans-serif; background:var(--ink); color:var(--paper); min-height:100vh; padding:22px 16px; display:flex; flex-direction:column; align-items:center; }
  h1 { font:400 30px Anton,sans-serif; text-transform:uppercase; letter-spacing:.03em; }
  h1 span { color:var(--red); }
  .sub { opacity:.6; font-size:13px; margin:4px 0 20px; }
  .box { width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; }
  label { font-size:13px; font-weight:600; opacity:.8; }
  input, select { width:100%; font:600 18px Inter,sans-serif; padding:14px; border-radius:10px; border:2px solid #333; background:#1b1b1b; color:var(--paper); outline:none; }
  input:focus, select:focus { border-color:var(--gold); }
  #code { font:800 26px ui-monospace,Menlo,monospace; letter-spacing:.08em; text-transform:uppercase; text-align:center; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  button { font:400 20px Anton,sans-serif; letter-spacing:.04em; text-transform:uppercase; padding:14px; border:0; border-radius:10px; cursor:pointer; color:#fff; background:#333; }
  button.primary { background:var(--red); }
  button.ok { background:var(--green); }
  button:disabled { opacity:.5; cursor:wait; }
  .result { border-radius:14px; padding:20px; text-align:center; min-height:120px; display:flex; flex-direction:column; justify-content:center; gap:6px; background:#1b1b1b; border:2px solid #333; }
  .result.valid { background:#0f3320; border-color:var(--green); }
  .result.used, .result.bad { background:#3a0e12; border-color:var(--red); }
  .result.done { background:var(--green); border-color:var(--green); }
  .big { font:400 40px Anton,sans-serif; text-transform:uppercase; }
  .small { font-size:14px; opacity:.85; }
  video { width:100%; border-radius:12px; background:#000; }
  .link { background:none; color:var(--gold); font:600 13px Inter,sans-serif; text-transform:none; padding:4px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <h1>Canje <span>BlackJack</span></h1>
  <p class="sub">Solo personal · Promo QR</p>

  <!-- Acceso -->
  <section class="box" id="login">
    <label for="pin">Clave del personal</label>
    <input type="password" id="pin" autocomplete="current-password">
    <label for="sede">Local</label>
    <select id="sede"><option>Ontinyent</option><option>Alcoy</option></select>
    <button class="primary" id="enter">Entrar</button>
    <p class="small" id="loginMsg" style="color:#ff8a8a"></p>
  </section>

  <!-- Canje -->
  <section class="box hidden" id="app">
    <p class="small" style="text-align:center">Local: <b id="sedeLbl"></b> · <button class="link" id="logout">cambiar</button></p>
    <video id="video" class="hidden" playsinline muted></video>
    <button id="scan" class="hidden">📷 Escanear QR del cliente</button>
    <label for="code">Código del ticket</label>
    <input id="code" placeholder="BJ-XXXX-XXXX" maxlength="12" autocomplete="off" autocapitalize="characters">
    <div class="row">
      <button id="check">Comprobar</button>
      <button class="ok" id="redeem" disabled>Canjear</button>
    </div>
    <div class="result" id="result"><span class="small">Escanea o escribe un código</span></div>
  </section>

<script src="config.js"></script>
<script>
(() => {
  const C = window.PROMO_CONFIG, $ = id => document.getElementById(id);
  const rpc = async (fn, body) => {
    const r = await fetch(`${C.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: C.SUPABASE_ANON_KEY, Authorization: `Bearer ${C.SUPABASE_ANON_KEY}` },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  };
  const prizeTxt = p => p === 'burger' ? '🍔 Burger' : '🍟 Patatas';
  const when = iso => new Date(iso).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  let pin = sessionStorage.getItem('bj_pin'), sede = sessionStorage.getItem('bj_sede');

  const show = (cls, html) => { $('result').className = 'result ' + cls; $('result').innerHTML = html; };
  const enterApp = () => { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('sedeLbl').textContent = sede; $('code').focus(); };

  $('enter').onclick = async () => {
    pin = $('pin').value; sede = $('sede').value;
    $('enter').disabled = true; $('loginMsg').textContent = '';
    try {
      const r = await rpc('check_ticket', { p_code: '-', p_pin: pin });
      if (r.status === 'bad_pin') { $('loginMsg').textContent = 'Clave incorrecta'; return; }
      sessionStorage.setItem('bj_pin', pin); sessionStorage.setItem('bj_sede', sede); enterApp();
    } catch { $('loginMsg').textContent = 'Sin conexión'; }
    finally { $('enter').disabled = false; }
  };
  $('pin').onkeydown = e => { if (e.key === 'Enter') $('enter').click(); };
  $('logout').onclick = () => { sessionStorage.clear(); location.reload(); };
  if (pin && sede) enterApp();

  // Formato automático BJ-XXXX-XXXX
  $('code').addEventListener('input', e => {
    let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.startsWith('BJ')) v = v.slice(2);
    v = v.slice(0, 8);
    e.target.value = v.length ? 'BJ-' + v.slice(0, 4) + (v.length > 4 ? '-' + v.slice(4) : '') : '';
    $('redeem').disabled = true;
    if (v.length === 8) check();
  });
  $('code').onkeydown = e => { if (e.key === 'Enter') check(); };

  async function check() {
    const code = $('code').value;
    if (code.length < 12) return show('bad', '<span class="small">Código incompleto</span>');
    $('check').disabled = true;
    try {
      const r = await rpc('check_ticket', { p_code: code, p_pin: pin });
      if (r.status === 'bad_pin') { sessionStorage.clear(); location.reload(); return; }
      if (r.status === 'not_found') show('bad', '<div class="big">No existe</div><span class="small">Revisa el código</span>');
      if (r.status === 'used') show('used', `<div class="big">Ya canjeado</div><span class="small">${prizeTxt(r.prize)} · ${when(r.redeemed_at)} en ${r.sede || '—'}</span>`);
      if (r.status === 'valid') { show('valid', `<span class="small">Válido</span><div class="big">${prizeTxt(r.prize)}</div><span class="small">${r.code}</span>`); $('redeem').disabled = false; }
    } catch { show('bad', '<span class="small">Sin conexión</span>'); }
    finally { $('check').disabled = false; }
  }
  $('check').onclick = check;

  $('redeem').onclick = async () => {
    $('redeem').disabled = true;
    try {
      const r = await rpc('redeem_ticket', { p_code: $('code').value, p_pin: pin, p_sede: sede });
      if (r.status === 'redeemed') {
        show('done', `<div class="big">✓ Canjeado</div><span class="small">Entrega: ${prizeTxt(r.prize)}</span>`);
        setTimeout(() => { $('code').value = ''; $('code').focus(); }, 400);
      } else if (r.status === 'used') {
        show('used', `<div class="big">Ya canjeado</div><span class="small">${when(r.redeemed_at)} en ${r.sede || '—'}</span>`);
      } else show('bad', '<div class="big">No existe</div>');
    } catch { show('bad', '<span class="small">Sin conexión, prueba otra vez</span>'); $('redeem').disabled = false; }
  };

  // Escáner con cámara (Chrome/Android y navegadores con BarcodeDetector)
  if ('BarcodeDetector' in window && navigator.mediaDevices) {
    $('scan').classList.remove('hidden');
    let stream = null;
    $('scan').onclick = async () => {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; $('video').classList.add('hidden'); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const v = $('video'); v.srcObject = stream; v.classList.remove('hidden'); await v.play();
        const det = new BarcodeDetector({ formats: ['qr_code'] });
        const loop = async () => {
          if (!stream) return;
          try {
            const codes = await det.detect(v);
            const hit = codes.map(c => c.rawValue.toUpperCase()).find(t => /^BJ-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(t));
            if (hit) {
              stream.getTracks().forEach(t => t.stop()); stream = null; v.classList.add('hidden');
              $('code').value = hit; check(); return;
            }
          } catch {}
          requestAnimationFrame(loop);
        };
        loop();
      } catch { show('bad', '<span class="small">No se pudo abrir la cámara</span>'); }
    };
  }
})();
</script>
</body>
</html>
